name: OpenRabbit Reviewer

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

concurrency:
  group: openrabbit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same-repo PRs: pull_request only (workflow from the branch, secrets available).
    # Fork PRs: pull_request_target only (secrets are withheld from fork pull_request).
    if: >
      github.event.pull_request.draft == false &&
      (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository)
      )
    steps:
      # Do not checkout the PR HEAD. pull_request_target runs with
      # repository secrets and a write token on the base branch.
      - name: Verify LLM_API_KEY
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::GitHub Actions secret LLM_API_KEY is empty. Add your Google AI Studio key under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: OpenRabbit
        uses: aryanbrite/openrabbit@bcd69296ca5ff18e10753bf0c170ff4fa5dfc050 # v0.8.7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_api_key: ${{ secrets.LLM_API_KEY }}
          # openrouter is the OpenAI-compatible adapter; traffic goes to Gemini.
          llm_provider: openrouter
          llm_api_url: https://generativelanguage.googleapis.com/v1beta/openai
          llm_model: gemini-3.7-flash
          review_mode: both
          tone_mode: balanced
          debiased_mode: "true"
