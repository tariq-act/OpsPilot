name: OpenRabbit Reviewer

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

concurrency:
  group: openrabbit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Same-repo PRs: pull_request only (workflow from the branch, secrets available).
    # Fork PRs: pull_request_target only (secrets are withheld from pull_request).
    if: >
      github.event.pull_request.draft == false &&
      (
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'pull_request_target' &&
         github.event.pull_request.head.repo.full_name != github.repository)
      )

    env:
      # Single model from Actions variable; default if unset.
      LLM_MODEL: ${{ vars.OPENRABBIT_LLM_MODEL || 'gemini-3.7-flash' }}
      OPENRABBIT_REF: bcd69296ca5ff18e10753bf0c170ff4fa5dfc050

    steps:
      # Do not checkout the PR HEAD.
      # pull_request_target runs with repository secrets and a write token
      # on the base branch.

      - name: Verify LLM_API_KEY
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::GitHub Actions secret LLM_API_KEY is empty. Add your Google AI Studio key under Settings → Secrets and variables → Actions."
            exit 1
          fi

      # Trusted OpenRabbit source at a pinned SHA — not PR code. Needed so we
      # can capture Gemini high-demand errors and soft-succeed with a PR comment.
      - name: Fetch OpenRabbit v0.8.7
        uses: actions/checkout@v4
        with:
          repository: aryanbrite/openrabbit
          ref: ${{ env.OPENRABBIT_REF }}
          path: openrabbit
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install and build OpenRabbit
        working-directory: openrabbit
        run: |
          npm install
          npm run build

      - name: OpenRabbit review
        id: review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          INPUT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          INPUT_LLM_PROVIDER: openrouter
          INPUT_LLM_API_URL: https://generativelanguage.googleapis.com/v1beta/openai
          INPUT_LLM_MODEL: ${{ env.LLM_MODEL }}
          INPUT_REVIEW_MODE: both
          INPUT_TONE_MODE: balanced
          INPUT_REVIEW_LENS: default
          INPUT_DEBIASED_MODE: "true"
          LLM_PROVIDER: openrouter
          LLM_API_URL: https://generativelanguage.googleapis.com/v1beta/openai
          REVIEW_MODE: both
          TONE_MODE: balanced
          REVIEW_LENS: default
          DEBIASED_MODE: "true"
        working-directory: openrabbit
        run: |
          set -uo pipefail

          echo "::notice::OpenRabbit review with model ${LLM_MODEL}"

          set +e
          log="$(node dist/action.js 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$log"

          if [ "$status" -eq 0 ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$log" | grep -Eiq \
            'LLM API error 503|LLM API error 429|LLM API error 502|LLM API error 504|UNAVAILABLE|RESOURCE_EXHAUSTED|high demand|try again later|capacity|temporarily unavailable'; then
            echo "::warning::Gemini is temporarily unavailable (high demand / rate limit). Posting a PR comment and succeeding the check."
            echo "result=unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::OpenRabbit failed with a non-temporary error. See log above."
          echo "result=failed" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Comment Gemini availability warning
        if: steps.review.outputs.result == 'unavailable'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_MARKER: "<!-- openrabbit-gemini-unavailable -->"
        run: |
          set -euo pipefail

          body="$(cat <<EOF
          ${COMMENT_MARKER}
          ⚠️ **OpenRabbit review temporarily unavailable**

          OpenRabbit could not complete the AI code review because Gemini model \`${LLM_MODEL}\` is currently experiencing high demand.

          > This model is currently experiencing high demand. Spikes in demand are usually temporary. Please try again later.

          The pull request itself is **not blocked**. You can rerun the workflow later, or change the Actions variable \`OPENRABBIT_LLM_MODEL\` to another model.
          EOF
          )"

          existing_id="$(
            gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --paginate \
              --jq "[.[] | select(.body | contains(\"${COMMENT_MARKER}\")) | .id] | .[0] // empty"
          )"

          payload="$(jq -n --arg body "$body" '{body: $body}')"

          if [ -n "$existing_id" ]; then
            echo "$payload" | gh api --method PATCH "repos/${GH_REPO}/issues/${PR_NUMBER}/comments/${existing_id}" --input -
            echo "Updated existing availability warning comment ${existing_id}."
          else
            echo "$payload" | gh api --method POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --input -
            echo "Posted availability warning comment."
          fi
