```yaml
name: Sync Project When PR Is Merged

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to sync"
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: read
  repository-projects: write

jobs:
  sync-project:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:
      - name: Update linked issues and project
        uses: actions/github-script@v7
        env:
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          PROJECT_STATUS_FIELD: Status
          PROJECT_DONE_OPTION: Done
        with:
          github-token: ${{ secrets.PROJECT_SYNC_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const projectId = process.env.PROJECT_ID;

            // Identify the PR for automatic or manual runs.
            const prNumber =
              context.eventName === "workflow_dispatch"
                ? Number(context.payload.inputs.pr_number)
                : context.payload.pull_request.number;

            if (!Number.isInteger(prNumber) || prNumber < 1) {
              throw new Error("A valid PR number is required.");
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });

            if (!pr.merged) {
              throw new Error(`PR #${prNumber} has not been merged.`);
            }

            core.info(`Processing merged PR #${prNumber}: ${pr.html_url}`);

            // Find issues linked through GitHub closing keywords.
            const linkedIssuesQuery = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 100) {
                      nodes {
                        number
                        title
                        repository {
                          name
                          owner {
                            login
                          }
                        }
                        projectItems(first: 100) {
                          nodes {
                            id
                            project {
                              id
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const linkedIssuesData = await github.graphql(
              linkedIssuesQuery,
              {
                owner,
                repo,
                number: prNumber
              }
            );

            const issues =
              linkedIssuesData.repository.pullRequest
                .closingIssuesReferences.nodes;

            // Close linked issues, including issues in other repositories.
            for (const issue of issues) {
              const issueOwner = issue.repository.owner.login;
              const issueRepo = issue.repository.name;

              await github.rest.issues.update({
                owner: issueOwner,
                repo: issueRepo,
                issue_number: issue.number,
                state: "closed"
              });

              core.info(
                `Closed issue ${issueOwner}/${issueRepo}#${issue.number}: ` +
                issue.title
              );
            }

            if (!projectId) {
              throw new Error(
                "PROJECT_ID is not configured. Set it as a repository " +
                "Actions variable to the internal Project V2 ID (PVT_...)."
              );
            }

            const statusFieldName =
              process.env.PROJECT_STATUS_FIELD || "Status";
            const doneName =
              process.env.PROJECT_DONE_OPTION || "Done";

            // Retrieve the target project and its fields.
            const projectQuery = `
              query($id: ID!) {
                node(id: $id) {
                  ... on ProjectV2 {
                    id
                    title
                    fields(first: 100) {
                      nodes {
                        ... on ProjectV2FieldCommon {
                          id
                          name
                        }
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const projectData = await github.graphql(projectQuery, {
              id: projectId
            });

            const project = projectData.node;

            if (!project) {
              throw new Error(
                `Could not find Project V2 with ID "${projectId}". ` +
                "Check the PROJECT_ID repository variable and token access."
              );
            }

            const statusField = project.fields.nodes.find(
              field =>
                field.name === statusFieldName &&
                Array.isArray(field.options)
            );

            const doneOption = statusField?.options.find(
              option =>
                option.name.toLowerCase() === doneName.toLowerCase()
            );

            if (!statusField || !doneOption) {
              throw new Error(
                `Could not find status field "${statusFieldName}" or ` +
                `option "${doneName}" in project "${project.title}".`
              );
            }

            // Collect linked issue items already in the target project.
            const itemsToSync = new Map();

            for (const issue of issues) {
              for (const item of issue.projectItems.nodes) {
                if (item.project.id === projectId) {
                  itemsToSync.set(item.id, item);
                }
              }
            }

            // Also include the merged PR if it is already in the project.
            const prItemsQuery = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    projectItems(first: 100) {
                      nodes {
                        id
                        project {
                          id
                        }
                      }
                    }
                  }
                }
              }
            `;

            const prItemsData = await github.graphql(prItemsQuery, {
              owner,
              repo,
              number: prNumber
            });

            for (const item of
              prItemsData.repository.pullRequest.projectItems.nodes) {
              if (item.project.id === projectId) {
                itemsToSync.set(item.id, item);
              }
            }

            if (itemsToSync.size === 0) {
              core.warning(
                `No linked issue or PR items were found in ` +
                `"${project.title}". No project statuses were changed.`
              );
            }

            // Set each matching item to Done.
            for (const item of itemsToSync.values()) {
              await github.graphql(
                `
                  mutation(
                    $project: ID!,
                    $item: ID!,
                    $field: ID!,
                    $option: String!
                  ) {
                    updateProjectV2ItemFieldValue(
                      input: {
                        projectId: $project
                        itemId: $item
                        fieldId: $field
                        value: {
                          singleSelectOptionId: $option
                        }
                      }
                    ) {
                      projectV2Item {
                        id
                      }
                    }
                  }
                `,
                {
                  project: projectId,
                  item: item.id,
                  field: statusField.id,
                  option: doneOption.id
                }
              );

              core.info(`Updated project item ${item.id} to Done.`);
            }

            core.info(`Project: ${project.title}`);
            core.info(`Merged PR: ${pr.html_url}`);
            core.info(
              `Finished. Updated ${itemsToSync.size} project item(s).`
            );
```
