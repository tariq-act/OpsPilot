reviews:
  profile: chill
  path_filters:
    # Drizzle snapshot JSON is generated and large. Review the migration SQL.
    - "!apps/api/src/db/migrations/**/snapshot.json"
  path_instructions:
    - path: "apps/api/**"
      instructions: |
        Scope every read and write to the caller's organization. Flag a query that trusts an organization id from the client without checking membership.
        Request bodies use class-validator DTOs and the global ValidationPipe (whitelist, forbidNonWhitelisted, transform). The Better Auth raw-body exception in main.ts is the only exception.
        Protected routes require a session. Public routes must be explicitly anonymous.
        Do not log secrets, session tokens, or passwords.
        New HTTP endpoints need request and response DTOs, ApiOperation, and the error responses the handler actually throws. Leave /api/auth routes out of Swagger.
    - path: "apps/api/src/db/**"
      instructions: |
        Schema changes need a new Drizzle migration. Do not edit a migration that has already shipped.
        Organization-owned tables need organizationId, an index on it, and the same row-level security stance as the organization schema.
        Queries belong in apps/api/src/db/queries, not in controllers.
    - path: "apps/web/**"
      instructions: |
        Server data goes through TanStack Query. Do not copy it into a second client store.
        Do not put secrets or server-only environment variables in client components. NEXT_PUBLIC_ values are public.
        Data views need loading, error, and empty states.
        Organization selection stays client-side on top of the query cache.
    - path: "packages/**"
      instructions: |
        Shared packages must not import from apps/api or apps/web.
    - path: ".github/**"
      instructions: |
        Workflow permissions stay at the minimum the job needs.
        A dependency scan must read bun.lock. Installing packages is not a vulnerability check.
        CI installs with a frozen lockfile.
        Dependabot uses the bun ecosystem for bun.lock, and docker-compose for compose.yaml.
  auto_review:
    enabled: true
    drafts: false
    ignore_usernames:
      - "dependabot[bot]"
